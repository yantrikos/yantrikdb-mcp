name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  # Re-run the full test matrix on the tagged commit before we ship.
  # We don't blindly trust that whoever cut the release first checked CI on main.
  unit:
    name: Unit tests (py${{ matrix.python-version }}, ${{ matrix.mcp-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        mcp-line: ["mcp1", "mcp2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: |
          python -m pip install -U pip
          pip install -e ".[dev,onnx]"
      # Both supported SDK majors are gated before we ship. Installed AFTER
      # the package so the pin wins, and asserted so a bad resolve can't
      # silently turn this leg into a duplicate of the other one.
      - name: Pin MCP SDK line (${{ matrix.mcp-line }})
        run: |
          if [ "${{ matrix.mcp-line }}" = "mcp1" ]; then
            pip install -U "mcp[cli]>=1.2.0,<2.0.0"
          else
            pip install -U "mcp[cli]>=2.0.0,<3.0.0"
          fi

      - name: Verify the intended SDK line is what got installed
        run: |
          python - <<'EOF'
          from yantrikdb_mcp._compat import MCP_MAJOR, sdk_line
          want = 1 if "${{ matrix.mcp-line }}" == "mcp1" else 2
          print(f"resolved {sdk_line()} (want major {want})")
          assert MCP_MAJOR == want, f"expected mcp {want}.x, got {sdk_line()}"
          EOF
      - run: pytest -q --ignore=tests/test_e2e_mcp.py

  e2e:
    name: E2E (${{ matrix.backend }} backend, ${{ matrix.mcp-line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [bundled, onnx, multilingual]
        mcp-line: ["mcp1", "mcp2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each backend job installs only its required deps so the e2e
      # parametrize computes BACKENDS = [<this backend>] and never runs
      # cross-backend variants.
      - name: Install (bundled — base deps only)
        if: matrix.backend == 'bundled'
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Install (with ONNX)
        if: matrix.backend == 'onnx'
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,onnx]"
      - name: Install (multilingual — base deps only; engine fetches model)
        if: matrix.backend == 'multilingual'
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pre-cache MiniLM
        if: matrix.backend == 'onnx'
        run: |
          python -c "from huggingface_hub import hf_hub_download; \
                     hf_hub_download('sentence-transformers/all-MiniLM-L6-v2', 'onnx/model.onnx'); \
                     hf_hub_download('sentence-transformers/all-MiniLM-L6-v2', 'tokenizer.json')"

      # Both supported SDK majors are gated before we ship. Installed AFTER
      # the package so the pin wins, and asserted so a bad resolve can't
      # silently turn this leg into a duplicate of the other one.
      - name: Pin MCP SDK line (${{ matrix.mcp-line }})
        run: |
          if [ "${{ matrix.mcp-line }}" = "mcp1" ]; then
            pip install -U "mcp[cli]>=1.2.0,<2.0.0"
          else
            pip install -U "mcp[cli]>=2.0.0,<3.0.0"
          fi

      - name: Verify the intended SDK line is what got installed
        run: |
          python - <<'EOF'
          from yantrikdb_mcp._compat import MCP_MAJOR, sdk_line
          want = 1 if "${{ matrix.mcp-line }}" == "mcp1" else 2
          print(f"resolved {sdk_line()} (want major {want})")
          assert MCP_MAJOR == want, f"expected mcp {want}.x, got {sdk_line()}"
          EOF
      - name: Run e2e
        env:
          YANTRIKDB_EMBEDDER: ${{ matrix.backend }}
          YANTRIKDB_TEST_MULTILINGUAL: ${{ matrix.backend == 'multilingual' && '1' || '0' }}
        run: pytest -q tests/test_e2e_mcp.py

  publish:
    name: Build + upload to PyPI
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # yantrikdb.com renders its "Latest releases" block from the GitHub
      # Releases API at build time, but it only rebuilds when something tells
      # it to. This tells it, so the site is current within a minute of a
      # release instead of waiting for its daily cron.
      #
      # NON-FATAL BY CONSTRUCTION. A marketing site that failed to rebuild is
      # not a release failure: no token, no network, no site — this step still
      # exits 0, and the site's own daily rebuild picks the release up.
      - name: Nudge yantrikdb.com to rebuild
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN not set - skipping; yantrikdb.com rebuilds daily anyway"
            exit 0
          fi
          curl -sS -f -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $SITE_DISPATCH_TOKEN"             https://api.github.com/repos/yantrikos/yantrikdb-web/dispatches             -d '{"event_type":"component-released","client_payload":{"component":"mcp","ref":"${{ github.ref_name }}"}}'             && echo "::notice::yantrikdb.com rebuild requested"             || echo "::warning::dispatch failed - yantrikdb.com will pick this up on its daily rebuild"
